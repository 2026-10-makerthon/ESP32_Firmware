[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sound-haptic-interface"
version = "1.0.0"
description = "Module-independent BLE sound/haptic contract and development harness"
requires-python = ">=3.12"
dependencies = ["bleak==3.0.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ziglang==0.14.1"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
